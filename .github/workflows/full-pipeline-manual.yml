name: Recipe Pipeline — Full Forced Run
# Manual-trigger only. This does NOT run on a schedule — it's for
# one-off full rebuilds (e.g. after changing popup/accessory/disclaimer
# logic), where every recipe needs to be reprocessed regardless of
# whether its Smartsheet row actually changed. Your normal incremental
# pipeline (recipe-pipeline.yml, on the 15-min schedule) is untouched.
on:
  workflow_dispatch: {}
permissions:
  contents: write  # required so the job can push commits back to the repo
concurrency:
  group: recipe-pipeline  # same group as the scheduled workflow, so the
                           # two never run at the same time and stomp on
                           # each other's zips/extracted/popup output
  cancel-in-progress: false
jobs:
  run-full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # full runs touch every recipe, so give it more room
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install wkhtmltopdf
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf
      - name: Install Python dependencies
        working-directory: Automation
        run: pip install -r requirements.txt
      - name: Run full forced pipeline
        working-directory: Automation
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_full_pipeline.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "recipe-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Full forced recipe rebuild ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit."
          fi
