name: Sync Recipe Finder

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Smartsheet Row ID"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Confirm trigger received
        run: echo "Triggered for row ${{ github.event.inputs.row_id }}"
