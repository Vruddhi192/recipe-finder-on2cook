name: Recipe Pipeline

on:
  schedule:
    # Runs every 15 minutes. GitHub's cron scheduler can lag a few minutes
    # under load — that's fine here, this isn't time-critical.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # required so the job can push commits back to the repo

concurrency:
  group: recipe-pipeline
  cancel-in-progress: false  # never cancel a mid-flight pipeline run; let it finish

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install wkhtmltopdf
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      - name: Install Python dependencies
        working-directory: Automation
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: Automation
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python all-in-one.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "recipe-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automated recipe sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit."
          fi
