<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login / Sign Up - Recipe Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="icon" href="on2cook favicon.png" type="image/png">
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container">
      <div class="nav-left">
        <img src="fork-knife.png" alt="Fork and Knife Icon" />
        <div class="nav-text">
          <h3>Recipe Finder</h3>
          <p>Discover your next favorite meal!</p>
        </div>
      </div>
      <div class="nav-right">
        <img src="on2cook logo_White 1.png" alt="Company Logo" class="logo" />
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">Login</button>
        <button id="tabSignup" class="auth-tab" type="button">Sign Up</button>
      </div>

      <p id="authMsg" class="auth-msg" style="display:none;"></p>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" />

        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">Log In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form" style="display:none;">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" required autocomplete="name" placeholder="Your name" />

        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required autocomplete="email" placeholder="you@example.com" />

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters" />

        <label for="signupPassword2">Confirm Password</label>
        <input type="password" id="signupPassword2" required autocomplete="new-password" placeholder="Re-type your password" />

        <button type="submit" class="auth-submit-btn" id="signupSubmitBtn">Create Account</button>
      </form>

      <a href="index.html" class="auth-back-link">&larr; Back to Recipe Finder</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
